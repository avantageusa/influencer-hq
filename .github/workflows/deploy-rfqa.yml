# ENGR-6662: SFTP merged theme files onto RFQA when the PR carried deploy-rfqa.
#
# 1. Tag a commit on the PR: git tag deploy-rfqa && git push origin deploy-rfqa
# 2. Merge the PR to main.
# 3. This workflow runs from main (`pull_request_target`), checks that
#    deploy-rfqa points at a commit in that PR, then uploads the merge's files.
#
# Tag reuse:
#   git push origin :refs/tags/deploy-rfqa
#   git tag -d deploy-rfqa
#   git tag deploy-rfqa
#   git push origin deploy-rfqa
#
# Merges without that tag skip upload. Docs/tests/CI paths are not uploaded.
#
# DEV_SFTP_HOST_KEY is the SFTP server's SHA256 fingerprint (FileZilla's
# trusted host key), not an SSH login. Without it the script refuses to send
# the password.

name: Deploy tagged commit (RFQA)

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

# One SFTP at a time. A later merge cancels an in-flight upload so an older
# run cannot finish last and overwrite a newer file on RFQA.
concurrency:
  group: deploy-rfqa
  cancel-in-progress: true

jobs:
  sftp:
    name: SFTP files from the merged tagged PR
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Merged result on main — not the PR head — so we upload what landed.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: true

      - id: gate
        name: Require deploy-rfqa on a commit in this PR
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          upload=false
          git fetch --no-tags origin "$PR_HEAD" "$PR_BASE"
          if git fetch origin refs/tags/deploy-rfqa:refs/tags/deploy-rfqa; then
            TAG_SHA="$(git rev-parse 'refs/tags/deploy-rfqa^{commit}')"
            if git merge-base --is-ancestor "$TAG_SHA" "$PR_HEAD" \
              && ! git merge-base --is-ancestor "$TAG_SHA" "$PR_BASE"; then
              upload=true
            else
              echo "deploy-rfqa is not on this PR; skipping upload."
            fi
          else
            echo "No deploy-rfqa tag; skipping upload."
          fi
          echo "upload=$upload" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.upload == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - if: steps.gate.outputs.upload == 'true'
        name: Install SFTP client
        run: python -m pip install "paramiko==3.5.1"

      - if: steps.gate.outputs.upload == 'true'
        name: Upload changed theme files
        env:
          DEV_SFTP_HOST: ${{ secrets.DEV_SFTP_HOST }}
          DEV_SFTP_USER: ${{ secrets.DEV_SFTP_USER }}
          DEV_SFTP_PASSWORD: ${{ secrets.DEV_SFTP_PASSWORD }}
          DEV_SFTP_PORT: ${{ secrets.DEV_SFTP_PORT }}
          DEV_SFTP_PATH: ${{ secrets.DEV_SFTP_PATH }}
          DEV_SFTP_HOST_KEY: ${{ secrets.DEV_SFTP_HOST_KEY }}
        run: python3 scripts/sftp-upload-tagged-commit.py
