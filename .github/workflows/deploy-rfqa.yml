# ENGR-6662: SFTP the tagged commit onto the RFQA theme, only after it is on main.
#
# Merge the PR first, then point deploy-rfqa at that merge commit:
#
#   git checkout main
#   git pull
#   git push origin :refs/tags/deploy-rfqa
#   git tag -d deploy-rfqa
#   git tag deploy-rfqa
#   git push origin deploy-rfqa
#
# Tagging a feature branch is refused: HEAD must already be on origin/main.
# Only files changed in that one commit are uploaded — not the whole theme.
#
# DEV_SFTP_HOST_KEY is the SFTP server's SHA256 fingerprint (FileZilla's
# trusted host key), not an SSH login. Without it the script refuses to send
# the password.

name: Deploy tagged commit (RFQA)

on:
  push:
    tags:
      - deploy-rfqa

permissions:
  contents: read

# One SFTP at a time. A later tag push cancels an in-flight upload so an older
# run cannot finish last and overwrite a newer file on RFQA.
concurrency:
  group: deploy-rfqa
  cancel-in-progress: true

jobs:
  sftp:
    name: SFTP files from the merged tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so we can see whether HEAD is already on main.
          # HEAD^ is still required so we can list files in this commit only.
          fetch-depth: 0
          persist-credentials: true

      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "deploy-rfqa must point at a commit already on main. Merge the PR, then tag that merge commit."
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install SFTP client
        run: python -m pip install "paramiko==3.5.1"

      - name: Upload changed theme files
        env:
          DEV_SFTP_HOST: ${{ secrets.DEV_SFTP_HOST }}
          DEV_SFTP_USER: ${{ secrets.DEV_SFTP_USER }}
          DEV_SFTP_PASSWORD: ${{ secrets.DEV_SFTP_PASSWORD }}
          DEV_SFTP_PORT: ${{ secrets.DEV_SFTP_PORT }}
          DEV_SFTP_PATH: ${{ secrets.DEV_SFTP_PATH }}
          DEV_SFTP_HOST_KEY: ${{ secrets.DEV_SFTP_HOST_KEY }}
        run: python3 scripts/sftp-upload-tagged-commit.py
